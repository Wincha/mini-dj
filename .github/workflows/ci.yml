name: CI

# Lint, tests y build en cada push y en cada pull request a main.
# Las pruebas de navegador (tests/e2e) NO corren aquí: necesitan un Chrome
# instalado y no deben poder tumbar la integración continua.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint + tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build web bundle
        run: npm run build
